# Shared homeBuddy infrastructure (see openspec homebuddy-deployment).
#
# - Creates the `homebuddy` network that every service stack joins as an
#   external network.
# - Runs the only Traefik that binds ports 80 and 443 on a host running
#   several homeBuddy services. It starts under the `production` profile only:
#     docker compose --profile production up -d
#   Without the profile no service is selected and Compose creates nothing;
#   on a development host create the network directly instead:
#     docker network create homebuddy
#   Compose refuses to adopt a `homebuddy` network created that way ("network
#   homebuddy was found but has incorrect label"). To move such a host to the
#   production profile, run `docker compose down` in every service stack,
#   then `docker network rm homebuddy`, start this stack, and start the
#   service stacks again. Volumes and data are kept.
# - Does NOT create the identity networks. Each product API reaches authBuddy
#   over its own internal-only network `<service>-identity`, whose only members
#   are that API and authBuddy. Compose creates only networks that a service in
#   this file attaches to, and no service here may join them, so create them
#   once on every host, production included:
#     docker network create --internal finanzbuddy-identity
#     docker network create --internal calendarbuddy-identity
#
# Do not run a service-local Traefik on a host that runs this one.
name: homebuddy

services:
  traefik:
    image: traefik:v3.7.17
    container_name: homebuddy-traefik
    profiles:
      - production
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=homebuddy"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.email=${TRAEFIK_ACME_EMAIL:-}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-acme:/letsencrypt
    networks:
      - homebuddy

networks:
  homebuddy:
    name: homebuddy
    driver: bridge

volumes:
  traefik-acme:
