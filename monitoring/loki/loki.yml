# Central homeBuddy log store (see openspec homebuddy-logging).
# Single-binary Loki with one tenant and filesystem storage in the `loki-data` volume.
# `auth_enabled: false` is safe only because Loki joins the root default network alone:
# no service stack joins that network, Traefik does not route it, and no host port is published.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # At info level Loki logs the text of every executed query. Its own logs are collected
  # into Loki, so a search for a secret would store that secret; warn keeps queries out.
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  # 15 days, the same as Prometheus.
  retention_period: 360h
  # Keep the label set to service, component, container, and stream: do not derive an
  # extra indexed `service_name` label. Level detection into structured metadata stays on.
  discover_service_name: []
  discover_log_levels: true

analytics:
  reporting_enabled: false
